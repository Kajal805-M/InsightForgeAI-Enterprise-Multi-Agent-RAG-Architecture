services:
  # Backend API (Python FastAPI)
  - type: web
    name: enterprise-rag-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: ohio
    envVars:
      - key: GEMINI_API_KEY
        sync: false # User must provide this in the Render Dashboard
      - key: CORS_ORIGINS
        value: "*" # Adjust for strict production security
    disk:
      name: data-storage
      mountPath: /app/uploads
      sizeGB: 1
  
  # Frontend UI (Nginx + Vite)
  - type: web
    name: enterprise-rag-frontend
    env: docker
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    plan: free
    region: ohio
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: enterprise-rag-backend
          envVarKey: RENDER_EXTERNAL_URL
